<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>買いレースAI</title>

<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 20px;
        background: linear-gradient(180deg, #dcecff, #f4f8ff);
    }
    h1 {
        text-align: center;
        font-size: 1.8rem;
        color: #0066cc;
        margin-bottom: 20px;
        font-weight: 800;
    }
    .box {
        background: white;
        padding: 18px;
        border-radius: 16px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        margin-bottom: 20px;
    }
    label {
        font-size: 0.95rem;
        font-weight: 600;
        margin-top: 12px;
        display: block;
        color: #004c99;
    }
    input, select {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border-radius: 10px;
        border: 1px solid #aac7ff;
        background: #f9fbff;
        font-size: 1rem;
    }
    button {
        width: 100%;
        padding: 15px;
        background: #1a73e8;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1.2rem;
        margin-top: 25px;
        font-weight: bold;
    }
    .result {
        font-size: 1.4rem;
        font-weight: bold;
        text-align: center;
        margin-top: 25px;
        color: #1a1a1a;
    }
</style>
</head>
<body>

<h1>買いレースAI</h1>

<div class="box">
    <label>頭数</label>
    <input id="head" type="number" placeholder="例：10">

    <label>距離（m）</label>
    <input id="distance" type="number" placeholder="例：2000">

    <label>馬場</label>
    <select id="surface">
        <option value="芝">芝</option>
        <option value="ダート">ダート</option>
    </select>

    <label>クラス</label>
    <select id="grade">
        <option value="G2">G2</option>
        <option value="G3">G3</option>
        <option value="2勝">2勝</option>
        <option value="3勝">3勝</option>
    </select>

    <label>騎手名</label>
    <input id="jockey" type="text" placeholder="例：川田将雅">

    <label>人気（1〜3）</label>
    <input id="popularity" type="number" placeholder="例：2">

    <label>単勝オッズ</label>
    <input id="odds" type="number" step="0.1" placeholder="例：3.4">

    <label>調教師名</label>
    <input id="trainer" type="text" placeholder="例：中内田充正">

    <button onclick="judge()">判定する</button>
    <div id="result" class="result"></div>
</div>

<script>
function judge() {
    const head = parseInt(document.getElementById("head").value);
    const distance = parseInt(document.getElementById("distance").value);
    const surface = document.getElementById("surface").value;
    const grade = document.getElementById("grade").value;
    const jockey = document.getElementById("jockey").value.trim();
    const popularity = parseInt(document.getElementById("popularity").value);
    const odds = parseFloat(document.getElementById("odds").value);
    const trainer = document.getElementById("trainer").value.trim();

    const strongJockeys = ["川田将雅", "C.ルメール", "R.ムーア", "坂井瑠星"];
    const strongTrainers = ["中内田充正", "友道康夫", "木村哲也", "国枝栄", "池江泰寿"];

    let ok = true;

    if (!(head >= 7 && head <= 12)) ok = false;
    if (!(distance >= 1800 && distance <= 2200)) ok = false;
    if (surface !== "芝") ok = false;
    if (!["G2","G3","2勝","3勝"].includes(grade)) ok = false;
    if (!strongJockeys.includes(jockey)) ok = false;
    if (!(popularity >= 1 && popularity <= 3)) ok = false;
    if (!(odds >= 2.0 && odds <= 4.9)) ok = false;
    if (!strongTrainers.includes(trainer)) ok = false;

    const result = document.getElementById("result");

    if (ok) {
        result.style.color = "#e60033";
        result.innerHTML = "🔥 このレースは買い！（期待値100%超え）";
    } else {
        result.style.color = "#555";
        result.innerHTML = "😢 買わない方がいい（条件不足）";
    }
}
</script>

</body>
</html>
